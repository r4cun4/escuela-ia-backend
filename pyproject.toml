[project]
name = "escuela-ia-backend"
version = "0.1.0"
description = "Backend para escuela IA con arquitectura hexagonal, FastAPI y Pydantic AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "google-genai>=1.0.0",
    "pydantic-ai>=0.0.14",
    "chromadb>=0.4.22",
    "logfire[fastapi]>=0.1.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "markitdown",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".venv",
    "data",
    "n8n_data",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
