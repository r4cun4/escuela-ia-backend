services:

  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///./data/escuela.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_VERSION=v1
    restart: always

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    environment:
      # Evita que ejecuciones colgadas queden en loop tras un restart
      - EXECUTIONS_TIMEOUT=120
      - EXECUTIONS_TIMEOUT_MAX=300
      # Guarda datos solo en error para diagnosticar sin acumular basura
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      # Marca ejecuciones previas como 'crashed' en lugar de dejarlas en 'running'
      - N8N_GRACEFUL_SHUTDOWN_TIMEOUT=30
    restart: always
