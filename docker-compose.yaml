services:
  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///./data/escuela.db
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_VERSION=v1
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
      - LOGFIRE_ENVIRONMENT=${LOGFIRE_ENVIRONMENT:-development}
    restart: always

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    # command: start --tunnel  <-- ELIMINAMOS ESTO
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    environment:
      - WEBHOOK_URL=${N8N_WEBHOOK_URL} # <-- LA INYECTAMOS POR VARIABLE
      - EXECUTIONS_TIMEOUT=120
      - EXECUTIONS_TIMEOUT_MAX=300
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - N8N_GRACEFUL_SHUTDOWN_TIMEOUT=30
    restart: always

  # NUEVO SERVICIO: Túnel de Cloudflare
  cloudflared:
    image: cloudflare/cloudflared:latest
    # Apuntamos el túnel al nombre del servicio de n8n y su puerto interno
    command: tunnel --url http://n8n:5678
    restart: always
    depends_on:
      - n8n